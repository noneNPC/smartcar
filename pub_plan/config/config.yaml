file_path_planner:
  ros__parameters:
    # -------------------------------------------------------------------
    # 1. 路径匹配与最近点搜索参数
    # -------------------------------------------------------------------
    search_window_size: 280         # 前向最近点局部搜索窗口大小（点数）
    search_backtrack_step: 8        # 允许向后回溯搜索的点数，防止轻微定位跳变导致索引无法回退
    out_of_window_thresh: 1.5       # 偏离路线容忍阈值（米），超出局部窗口尝试全局搜索
    recovery_cooldown: 1.0          # 触发 Recovery (恢复机制) 的最小冷却时间（秒）

    # -------------------------------------------------------------------
    # 2. Goal 触发与发送模式参数
    # -------------------------------------------------------------------
    send_mode: "index"              # Goal发送模式："distance" (物理距离) 或 "index" (索引步进)
    min_move_dist: 0.10             # distance 模式下，两次发送之间机器人最小移动物理距离（米）
    min_index_step: 1              # index 模式下，裁剪后的路径起点索引前进多少点才重新发送 Goal
    force_send_interval: 1.0        # 超时强制刷新间隔（秒），即使路径起点未变也强发心跳包，防止控制器停滞

    # -------------------------------------------------------------------
    # 3. 路径动态裁剪（Trim）与单调性防护设置
    # -------------------------------------------------------------------
    trim_sent_path: true            # 是否裁剪机器人已经经过的路径（从车身最近点往前裁）
    trim_sent_distance: 0.10        # 设定的裁剪物理距离（米），避免 MPPI 反复跟踪车身附近的微小扰动
    max_trim_ratio: 0.4             # 裁剪物理距离占前瞻距离的最大比例上限（0.4 即最多裁剪 40%），防止局部路径过短
    backtrack_tolerance: 1          # Trim 起点回退容忍点数，在此范围内的微小逆向抖动将被高水位机制强制平滑

    # -------------------------------------------------------------------
    # 4. 不同路径 ID 的动态前瞻距离（Forward Length）配置
    # -------------------------------------------------------------------
    path_config:
      path_2:
        forward_length: 3.0         # ID 2 路径的前瞻截取长度（米）
      path_3:
        forward_length: 3.0         # ID 3 路径的前瞻截取长度（米）
      path_4:
        forward_length: 3.0         # ID 4 路径的前瞻截取长度（米）