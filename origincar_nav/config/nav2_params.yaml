controller_server:
  ros__parameters:
    odom_topic: /odom_combined
    controller_frequency: 20.0          # 控制器运行频率(Hz)
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"   # Nav2 MPPI 

      # ================= MPPI预测参数 =================
      time_steps: 25                    # 预测时域的步数
      model_dt: 0.05                    # 每步的时间间隔(s)，总预测时间 = time_steps × model_dt = 2.4s
      batch_size: 4500                  # 每周期生成的随机采样轨迹数量，值越大轨迹拟合越优，但 CPU 消耗剧增
      iteration_count: 1                # 每周期优化迭代次数，MPPI 默认取 1 即可满足实时性

      # ================= 控制采样参数 (高斯噪声标准差) =================
      vx_std: 2.0                      # 线速度 Vx 的采样标准差，控制前向速度的探索幅度
      vy_std: 0.0                       # 横向速度 Vy 的采样标准差，阿克曼(Ackermann)结构没有侧移能力，必须设为 0
      wz_std: 1.5                      # 角速度 Wz 的采样标准差，控制转向角速度的探索幅度

      # ================= 速度与角速度物理极值限制 =================
      vx_max: 2.5                       # 最大前进线速度 (m/s)
      vx_min: -0.8                      # 最大倒车线速度 (m/s，负值表示倒车)
      vy_max: 0.0                       # 最大横向线速度 (m/s)，阿克曼结构必须设为 0
      wz_max: 2.0                       # 最大转向角速度 (rad/s)

      # ================= MPPI算法核心参数 =================
      prune_distance: 2.0               # 裁剪全局路径的距离(m)
      transform_tolerance: 0.1          # TF 坐标变换的最大允许延迟/超时时间(s)
      temperature: 3.0                 # 3.0 采样权重分布的温度系数：值越小越偏向最优轨迹(激进)，值越大轨迹越分散加权(平滑)
      gamma: 2.0                       # 2.0    控制平滑度/抑制抖动的系数，越大对控制量突变的惩罚越重

      # ================= 运动学模型 =================
      motion_model: "Ackermann"         # 运动学模型，选择阿克曼转向模型

      # ================= 可视化设置 =================
      visualize: true                   # 是否在 RViz 中发布采样轨迹的 Marker
      TrajectoryVisualizer:
        trajectory_step: 100             # 采样轨迹可视化抽样间隔：每 40 条采样轨迹中仅绘制 1 条
        time_step: 5                    # 轨迹点可视化抽样间隔：每隔 2 个预测时间步绘制 1 个点

      # ================= 阿克曼运动学约束 =================
      AckermannConstraints:
        min_turning_r: 0.28             # 车辆物理最小转弯半径(m)，受限于最大前轮转向角

      # ================= 启用评分器 (Critics) =================
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
          "VelocityDeadbandCritic",
        ]

      # ================= 1. 约束评分器 =================
      ConstraintCritic:
        enabled: true                   # 启用运动学/动力学约束检测
        cost_power: 1                   # 代价指数乘方 (代价 = weight * (raw_cost ^ cost_power))
        cost_weight: 2.2                # 违背最小转弯半径等约束时的惩罚权重

      # ================= 2. 目标点距离评分器 =================
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0                # 鼓励轨迹终点尽可能接近全局路径终点/目标的权重
        threshold_to_consider: 0.1      # 仅当距离目标小于 0.1m 时，该评分器才开始激活生效

      # ================= 3. 目标点朝向评分器 =================
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0                # 接近终点时，调整机器人车头朝向与目标朝向一致的权重
        threshold_to_consider: 0.1      # 当距离目标小于 1.0m 时，该评分器开始激活生效

      # ================= 4. 前进偏好评分器 =================
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0                # 倒车行为的惩罚权重（权重越大越强迫车辆优先选择前进）
        threshold_to_consider: 0.01      # 当距离目标大于 0.2m 时激活（接近目标 0.2m 内允许倒车调整）

      # ================= 5. 障碍物/代价地图评分器 =================
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0               # 靠近障碍物（高 CostMap 值）的惩罚权重
        critical_cost: 100.0            # 临界代价阈值，超过此值的区域将被视为高风险碰撞区
        consider_footprint: true        # 是否使用完整的机器人多边形轮廓(Footprint)进行精准碰撞检测
        collision_cost: 10000000000.0 # 轨迹发生硬碰撞时的极高惩罚值，确保淘汰碰撞轨迹
        near_goal_distance: 0.5         # 距离终点小于 0.1m 时降低碰撞检查约束，以便贴近目标点停车

      # ================= 6. 路径贴合度评分器 (横向偏差) =================
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 120.0               # 惩罚轨迹偏离全局路径横向距离的权重（越大越紧贴路径）
        max_path_occupancy_ratio: 0.05  # 全局路径被障碍物遮挡的最大可接受比例，超过则暂时失效
        trajectory_point_step: 3        # 计算贴合偏差时，在采样轨迹上每隔 3 个预测点采样计算一次
        threshold_to_consider: 0.5      # 当距离目标大于 0.1m 时激活，防止终点附近限制机器人调整姿态
        offset_from_furthest: 10        # 在全局路径上从最远追逐点倒退 10 个点作为贴合对齐的目标段
        use_path_orientations: false    # 计算偏差时是否考虑全局路径的 Yaw 角（false 则仅计算几何距离）

      # ================= 7. 路径跟随前向评分器 (纵向推进) =================
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.5               # 鼓励轨迹沿全局路径向前推进（沿着路径走得更远）的权重
        offset_from_furthest: 3         # 在全局路径上从最远可达点倒退 3 个点作为前向追踪的目标点
        threshold_to_consider: 0.3      # 当距离目标大于 0.3m 时激活

      # ================= 8. 路径切线朝向评分器 =================
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 22.0               # 惩罚机器人车头朝向与全局路径切线方向不一致的权重
        offset_from_furthest: 10         # 在全局路径上从最远追逐点倒退 4 个点来计算路径切线朝向
        threshold_to_consider: 0.1      # 当距离目标大于 0.1m 时激活

      # ================= 9. 低速/死区抖动抑制评分器 =================
      VelocityDeadbandCritic:
        enabled: true                   # 启用速度死区惩罚，防止低速下的电机微调抖动
        cost_power: 1
        cost_weight: 4.5                # 对落入死区范围内的速度施加惩罚的权重
        deadband_velocities: [0.35, 0.0, 0.5] # 死区阈值数组 [vx, vy, wz]：线速度低于 0.5m/s 或角速度低于 0.7rad/s 时给予惩罚

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0           
      publish_frequency: 10.0         
      global_frame: odom_combined     
      robot_base_frame: base_link      
      footprint: "[[0.17,0.12],[0.17,-0.12],[-0.17,-0.12],[-0.17,0.12]]"
      use_sim_time: False               
      rolling_window: true             
      width: 4                         
      height: 4                       
      resolution: 0.05                 
      robot_radius: 0.15
      transform_tolerance: 0.2               
      plugins: ["obstacle_layer", "inflation_layer"]  
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"   
        cost_scaling_factor: 6.0                  
        inflation_radius: 0.15                     
        
      obstacle_layer:                  
        plugin: "nav2_costmap_2d::ObstacleLayer"      
        enabled: True                              
        observation_sources: scan      
                    
        scan:
          topic: /scan                               
          max_obstacle_height: 2.0                   
          clearing: True                           
          marking: True                             
          data_type: "LaserScan"  
          observation_persistence: 0.5                      
          raytrace_max_range: 2.5                   
          raytrace_min_range: 0.1                     
          obstacle_max_range: 2.0                   
          obstacle_min_range: 0.0                     
      always_send_full_costmap: False


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0                 # costmap 更新频率（Hz），每秒更新次数
      publish_frequency: 2.0                # 发布 costmap 的频率（Hz）
      global_frame: map                     # 全局坐标系，一般用 map
      robot_base_frame: base_link           # 机器人自身坐标系
      footprint: "[[0.17,0.12],[0.17,-0.12],[-0.17,-0.12],[-0.17,0.12]]"
      use_sim_time: False                    # 是否使用仿真时间
      robot_radius: 0.15                    # 机器人半径（m），用于障碍物膨胀
      resolution: 0.05                       # 栅格分辨率（m）
      track_unknown_space: true             # 是否将未知区域视为占用
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # costmap 层插件列表
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"  # 动态障碍物层插件
        enabled: True                           # 是否启用该层
        observation_sources: scan               # 使用的传感器
        scan:
          topic: /scan                          # 激光雷达话题
          max_obstacle_height: 2.0              # 能检测到的最大障碍物高度（m）
          clearing: True                         # 是否允许清除障碍物
          marking: True                          # 是否标记障碍物
          data_type: "LaserScan"                 # 数据类型
          raytrace_max_range: 3.0                # 射线追踪最大距离（m）
          raytrace_min_range: 0.0                # 射线追踪最小距离（m）
          obstacle_max_range: 2.5                # 障碍物检测最大距离（m）
          obstacle_min_range: 0.0                # 障碍物检测最小距离（m）
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"    # 静态地图层插件
        map_subscribe_transient_local: True      # 使用 transient_local 订阅 map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # 膨胀层插件，用于障碍物外扩
        cost_scaling_factor: 10.0                   # 膨胀成本衰减系数
        inflation_radius: 0.45                     # 膨胀半径（m）
      always_send_full_costmap: True               # 每次发布完整 costmap

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
