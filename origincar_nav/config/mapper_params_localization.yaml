slam_toolbox:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 求解器插件与 Ceres 优化器参数 (Ceres Solver Parameters)
    # --------------------------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver        # 使用的图优化后端求解器插件
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY     # 线性求解器类型：稀疏 Normal Cholesky 分解（适合 Slam 图优化）
    ceres_preconditioner: SCHUR_JACOBI              # 预条件子类型：Schur Jacobi 预条件子
    ceres_trust_strategy: LEVENBERG_MARQUARDT        # 信赖域策略：Levenberg-Marquardt (LM) 算法
    ceres_dogleg_type: TRADITIONAL_DOGLEG            # Dogleg 优化类型：传统 Dogleg
    ceres_loss_function: None                       # 损失函数类型：无（若环境中噪点多，可设为 Huber 等鲁棒损失函数）

    # --------------------------------------------------------------------------
    # ROS 坐标系与基础话题参数 (ROS Frames & Topics)
    # --------------------------------------------------------------------------
    odom_frame: odom_combined                       # 里程计坐标系名称（常用 odom 或 odom_combined）
    map_frame: map                                  # 地图坐标系名称
    base_frame: base_link                           # 机器人基座坐标系名称
    scan_topic: /scan                               # 订阅的 2D 激光雷达数据话题
    mode: localization                              # 运行模式：localization (纯定位) 或 mapping (建图)

    # --------------------------------------------------------------------------
    # 地图加载与定位初始化 (Map Loading & Localization Initialization)
    # --------------------------------------------------------------------------
    # 启动时需要加载的预建地图文件路径（不带后缀名，需要存在 .posegraph 和 .data 文件）
    map_file_name: /root/npc_ws/src/origincar_nav/map/race_map
    map_start_pose: [0.0, 0.0, 0.0]                  # 机器人初始位姿估计 [x(米), y(米), yaw(弧度)]

    # --------------------------------------------------------------------------
    # 系统与运行控制参数 (System & Runtime Controls)
    # --------------------------------------------------------------------------
    debug_logging: false                            # 是否开启调试日志打印
    throttle_scans: 1                               # 激光雷达数据节流：每 N 帧处理 1 帧（1 表示处理所有数据）
    transform_publish_period: 0.02                  # 发布 map->odom TF 变换的周期（秒）。设为 0 则停止发布
    map_update_interval: 5.0                        # 向系统更新/发布占用栅格地图的间隔时间（秒）
    resolution: 0.05                                # 生成地图的分辨率（米/像素），0.05 即 5 厘米/像素
    min_laser_range: 0.2                            # 用于栅格化地图的激光雷达最小有效距离（米）
    max_laser_range: 8.0                            # 用于栅格化地图的激光雷达最大有效距离（米）
    minimum_time_interval: 0.1                      # 处理连续两帧激光扫描的最小时间间隔（秒）
    transform_timeout: 0.5                          # TF 坐标变换查询的超时时间（秒）
    tf_buffer_duration: 30.                         # TF 缓冲区保存的历史时间长度（秒）
    stack_size_to_use: 40000000                     # 程序可调用的栈大小（字节），在序列化/保存大型地图时防止栈溢出

    # --------------------------------------------------------------------------
    # 通用扫描匹配与图匹配参数 (General Scan Matching & Graph Parameters)
    # --------------------------------------------------------------------------
    use_scan_matching: true                         # 是否使用激光扫描匹配来修正位姿
    use_scan_barycenter: true                       # 是否使用点云重心代替雷达中心进行匹配计算
    minimum_travel_distance: 0.005                   # 触发更新的最小平移距离（米），移动超过此距离才添加新节点
    minimum_travel_heading: 0.001                    # 触发更新的最小旋转角度（弧度，约 2.87 度）
    scan_buffer_size: 2                             # 扫描缓冲区大小（保存用于定位匹配的最近扫描帧数）
    scan_buffer_maximum_scan_distance: 10.0         # 扫描缓冲区中允许保留的最大雷达探测距离（米）
    link_match_minimum_response_fine: 0.1           # 局域图建边（Link）时精匹配所需的最低得分/响应值
    link_scan_maximum_distance: 1.5                 # 允许尝试连接图节点的最大空间距离（米）
    do_loop_closing: false                          # 是否开启闭环检测
    loop_match_minimum_chain_size: 3                # 触发闭环候选所需的最少连续匹配帧数
    loop_match_maximum_variance_coarse: 3.0         # 闭环粗匹配时允许的最大方差限值
    loop_match_minimum_response_coarse: 0.35        # 闭环粗匹配所需的最低匹配得分
    loop_match_minimum_response_fine: 0.45          # 闭环精匹配所需的最低匹配得分

    # --------------------------------------------------------------------------
    # 相关性匹配参数 - 局部搜索 (Correlation Parameters - Local Search)
    # --------------------------------------------------------------------------
    correlation_search_space_dimension: 0.5         # 局部相关性搜索空间的大小范围（米，即以当前估计为中心 ±0.5m）
    correlation_search_space_resolution: 0.01       # 局部相关性搜索的空间分辨率（米）
    correlation_search_space_smear_deviation: 0.1   # 匹配得分平滑/涂抹的高斯标准差（米），防止局部极小值

    # --------------------------------------------------------------------------
    # 相关性匹配参数 - 闭环搜索 (Correlation Parameters - Loop Closure)
    # --------------------------------------------------------------------------
    loop_search_space_dimension: 8.0                # 闭环检测时的搜索空间范围（米）
    loop_search_space_resolution: 0.05              # 闭环检测搜索空间的分辨率（米）
    loop_search_space_smear_deviation: 0.03          # 闭环匹配得分平滑的高斯标准差（米）
    loop_search_maximum_distance: 3.0               # 闭环候选节点与当前位置的最大允许距离（米）

    # --------------------------------------------------------------------------
    # 扫描匹配器惩罚与搜索参数 (Scan Matcher Penalties & Search Strategy)
    # --------------------------------------------------------------------------
    distance_variance_penalty: 0.5                  # 偏离里程计预测平移距离的惩罚权重（防止发生位置突变）
    angle_variance_penalty: 1.0                     # 偏离里程计预测旋转角度的惩罚权重（防止发生角度突变）

    fine_search_angle_offset: 0.00349               # 精搜索时的角度偏移量/步骤步长（弧度，约 0.2 度）
    coarse_search_angle_offset: 0.349               # 粗搜索时的角度搜索总范围（弧度，约 20 度）
    coarse_angle_resolution: 0.0349                 # 粗搜索时的角度分辨率步长（弧度，约 2 度）
    minimum_angle_penalty: 0.9                      # 角度匹配惩罚的最小比例阈值
    minimum_distance_penalty: 0.5                   # 距离匹配惩罚的最小比例阈值
    use_response_expansion: true                    # 匹配得分较低时，是否自动扩大搜索范围尝试再次匹配
    min_pass_through: 2                             # 射线穿透计数阈值（计算栅格空闲状态所需的最少光线穿透数）
    occupancy_threshold: 0.1                        # 栅格被判定为“占用/有障碍物”的概率阈值